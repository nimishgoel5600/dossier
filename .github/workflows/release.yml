name: Release

# A version tag (v1.0.0) releases the image CI built for that commit: it's
# tagged with the version and "latest" on GHCR, and a GitHub release is made
# with the tag's message as its notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI builds it once the checks pass on main, which takes a while when
      # the tag is pushed together with its commit.
      - name: Wait for the commit's image
        run: |
          for attempt in $(seq 1 80); do
            if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then exit 0; fi
            sleep 60
          done
          echo "::error::There's no image for $GITHUB_SHA on GHCR after 80 minutes. Check this commit's CI run, then re-run this workflow."
          exit 1

      - name: Tag it with the version
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          notes=""
          if [ -n "$object" ]; then notes=$(gh api "repos/$GH_REPO/git/tags/$object" --jq .message); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Dossier ${GITHUB_REF_NAME#v}" --notes "${notes:-Dossier ${GITHUB_REF_NAME#v}}"
